name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start test dependencies
        run: docker compose up -d postgres redis minio --wait
      - name: Build backend and review images
        run: docker compose --profile test build tests api migrate review review-tests review-test-migrate
      - name: Apply and validate migrations
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check
      - name: Ruff format and lint
        run: |
          docker compose --profile test run --rm tests python -m ruff format --check .
          docker compose --profile test run --rm tests python -m ruff check .
      - name: Backend tests
        run: docker compose --profile test run --rm tests
      - name: Review TypeScript, lint and production build
        run: |
          docker compose --profile test run --rm review-tests npm run typecheck
          docker compose --profile test run --rm review-tests npm run lint
          docker compose --profile test run --rm review-tests npm run build
      - name: Review API PostgreSQL tests
        run: docker compose --profile test run --rm review-tests
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Stop services
        if: always()
        run: docker compose --profile test down

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint and component tests
        run: |
          npm run lint
          npm test
      - name: Production build
        run: npm run build
