name: freightiq

services:
  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freightiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freightiq}
      POSTGRES_DB: ${POSTGRES_DB:-freightiq}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/${POSTGRES_DB:-freightiq}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
