name: freightiq

services:
  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freightiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freightiq}
      POSTGRES_DB: ${POSTGRES_DB:-freightiq}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: ./docker/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-freightiq}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-freightiq-local-only}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: runtime
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/${POSTGRES_DB:-freightiq}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  review:
    build:
      context: ./review-service
      target: runtime
    environment:
      REVIEW_DATABASE_URL: postgresql://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/${POSTGRES_DB:-freightiq}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-30000}
      HOST: 0.0.0.0
      PORT: 8001
      LOG_LEVEL: info
    ports: ["127.0.0.1:${REVIEW_PORT:-8001}:8001"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/${POSTGRES_DB:-freightiq}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: freightiq-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-freightiq}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-freightiq-local-only}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: freightiq-api
    build:
      context: ./backend
      target: runtime
    command: celery -A tasks.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/${POSTGRES_DB:-freightiq}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: freightiq-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-freightiq}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-freightiq-local-only}
      REVIEW_SERVICE_URL: http://review:8001
      REVIEW_SERVICE_TIMEOUT_SECONDS: ${REVIEW_SERVICE_TIMEOUT_SECONDS:-2}
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped

  tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/${POSTGRES_DB:-freightiq}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: freightiq-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-freightiq}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-freightiq-local-only}
      REVIEW_SERVICE_URL: http://review:8001
      REVIEW_INTEGRATION_URL: http://review:8001
    depends_on:
      review: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  review-test-migrate:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    command: python tests/prepare_review_database.py
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/freightiq_review_test
    depends_on:
      postgres: {condition: service_healthy}

  review-tests:
    build:
      context: ./review-service
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@postgres:5432/freightiq_review_test
    depends_on:
      review-test-migrate: {condition: service_completed_successfully}

volumes:
  postgres-data:
  redis-data:
  minio-data:
